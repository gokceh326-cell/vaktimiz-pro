name: Vaktimiz Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Android APK Derleme
    runs-on: ubuntu-latest

    steps:

      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Proje klasörlerini hazırla
        shell: bash
        run: |
          set -e

          if [ ! -f "index.html" ]; then
            echo "HATA: Ana dizinde index.html bulunamadı."
            exit 1
          fi

          rm -rf android-app

          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/java/com/vaktimizpro/app
          mkdir -p android-app/app/src/main/res/values

      - name: Web dosyalarını APK içine kopyala
        shell: bash
        run: |
          set -e

          cp "index.html" \
             "android-app/app/src/main/assets/index.html"

          shopt -s dotglob nullglob

          for item in *; do
            case "$item" in
              .git)
                ;;
              .github)
                ;;
              android-app)
                ;;
              node_modules)
                ;;
              build)
                ;;
              release)
                ;;
              app)
                ;;
              gradle)
                ;;
              *)
                if [ -d "$item" ]; then
                  cp -R "$item" \
                    "android-app/app/src/main/assets/"
                elif [ -f "$item" ]; then
                  if [ "$item" != "index.html" ]; then
                    cp "$item" \
                      "android-app/app/src/main/assets/"
                  fi
                fi
                ;;
            esac
          done

      - name: settings.gradle oluştur
        shell: bash
        run: |
          cat > android-app/settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "VaktimizPro"

include ":app"
EOF

      - name: Ana Gradle dosyasını oluştur
        shell: bash
        run: |
          cat > android-app/build.gradle <<'EOF'
plugins {
    id "com.android.application" version "8.7.3" apply false
}
EOF

      - name: Gradle özelliklerini oluştur
        shell: bash
        run: |
          cat > android-app/gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
EOF

      - name: Android build.gradle oluştur
        shell: bash
        run: |
          cat > android-app/app/build.gradle <<'EOF'
plugins {
    id "com.android.application"
}

android {
    namespace "com.vaktimizpro.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.vaktimizpro.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
EOF

      - name: AndroidManifest oluştur
        shell: bash
        run: |
          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

    <application
        android:allowBackup="true"
        android:label="Vaktimiz Pro"
        android:theme="@style/AppTheme"
        android:usesCleartextTraffic="true">

        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:screenOrientation="portrait">

            <intent-filter>

                <action android:name="android.intent.action.MAIN" />

                <category
                    android:name="android.intent.category.LAUNCHER" />

            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

      - name: Android temasını oluştur
        shell: bash
        run: |
          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<resources>

    <style
        name="AppTheme"
        parent="android:style/Theme.Material.Light.NoActionBar">

        <item name="android:fontFamily">sans</item>
        <item name="android:windowActionModeOverlay">true</item>
        <item name="android:statusBarColor">#000000</item>
        <item name="android:navigationBarColor">#000000</item>
        <item name="android:windowLightStatusBar">false</item>
        <item name="android:windowNoTitle">true</item>

    </style>

</resources>
EOF

      - name: MainActivity oluştur
        shell: bash
        run: |
          cat > android-app/app/src/main/java/com/vaktimizpro/app/MainActivity.java <<'EOF'
package com.vaktimizpro.app;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;

public class MainActivity extends Activity {

    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        webView = new WebView(this);

        setContentView(webView);

        WebSettings settings = webView.getSettings();

        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setDatabaseEnabled(true);

        settings.setAllowFileAccess(true);
        settings.setAllowContentAccess(true);

        settings.setJavaScriptCanOpenWindowsAutomatically(true);
        settings.setMediaPlaybackRequiresUserGesture(false);

        webView.setWebViewClient(new WebViewClient());
        webView.setWebChromeClient(new WebChromeClient());

        webView.loadUrl("file:///android_asset/index.html");
    }

    @Override
    public void onBackPressed() {

        if (webView != null && webView.canGoBack()) {
            webView.goBack();
        } else {
            super.onBackPressed();
        }
    }
}
EOF

      - name: Gradle 8.9 indir
        shell: bash
        run: |
          set -e

          curl -fL \
            "https://services.gradle.org/distributions/gradle-8.9-bin.zip" \
            -o "/tmp/gradle-8.9-bin.zip"

          rm -rf "/tmp/gradle-8.9"

          unzip -q \
            "/tmp/gradle-8.9-bin.zip" \
            -d "/tmp"

          "/tmp/gradle-8.9/bin/gradle" --version

      - name: Android projesini kontrol et
        shell: bash
        working-directory: android-app
        run: |
          set -e

          echo "Android proje yapısı:"
          find . -maxdepth 5 -type f | sort

      - name: APK oluştur
        shell: bash
        working-directory: android-app
        run: |
          set -e

          "/tmp/gradle-8.9/bin/gradle" \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: APK dosyasını kontrol et
        shell: bash
        run: |
          set -e

          APK_PATH="android-app/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "HATA: APK bulunamadı."
            echo "Oluşan dosyalar:"
            find android-app -type f | sort
            exit 1
          fi

          echo "APK bulundu:"
          ls -lh "$APK_PATH"

      - name: APK imzasını doğrula
        shell: bash
        run: |
          set -e

          APK_PATH="android-app/app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "HATA: apksigner bulunamadı."
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            "$APK_PATH"

      - name: APK'yı paketle
        shell: bash
        run: |
          set -e

          rm -rf release

          mkdir -p release

          cp \
            "android-app/app/build/outputs/apk/debug/app-debug.apk" \
            "release/Vaktimiz-Pro.apk"

          ls -lh "release/Vaktimiz-Pro.apk"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Vaktimiz-Pro-APK
          path: release/Vaktimiz-Pro.apk
          if-no-files-found: error
