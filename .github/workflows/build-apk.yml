name: Android APK Oluştur

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ana

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle izinlerini ayarla
        run: chmod +x gradlew

      - name: APK oluştur
        run: ./gradlew assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: VakitmizPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
