name: Vaktimiz Pro - APK Oluştur

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: APK Oluştur
    runs-on: ubuntu-latest

    steps:

      # 1. Projeyi indir
      - name: Kaynak kodunu al
        uses: actions/checkout@v6

      # 2. Java 17
      - name: Java 17 kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Gradle kurulumu ve önbellekleme
      - name: Gradle kurulumu
        uses: gradle/actions/setup-gradle@v6

      # 4. Gradle Wrapper izinlerini düzelt
      - name: Gradle Wrapper izinleri
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "HATA: gradlew bulunamadı."
            echo "Proje dosyaları:"
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

      # 5. Projeyi temizle
      - name: Temizle
        run: |
          ./gradlew clean --no-daemon

      # 6. Release APK oluştur
      - name: Release APK oluştur
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      # 7. Oluşan APK'yı kesin olarak bul
      - name: APK dosyasını kontrol et
        shell: bash
        run: |
          echo "======================================"
          echo "APK DOSYALARI"
          echo "======================================"

          find . -type f -name "*.apk" -print

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "HATA: APK oluşturulamadı veya bulunamadı."
            echo ""
            echo "build klasörleri:"
            find . -type d -name "build" -print
            echo ""
            echo "APK çıktıları:"
            find . -type d -path "*/outputs/*" -print
            exit 1
          fi

          echo ""
          echo "Bulunan APK sayısı: $APK_COUNT"

      # 8. APK'yı tek bir klasörde topla
      - name: APK'yı paketle
        shell: bash
        run: |
          mkdir -p apk-output

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./apk-output/*" \
            -exec cp {} apk-output/VaktimizPro.apk \;

          echo ""
          echo "APK hazır:"
          ls -lh apk-output/

      # 9. APK'yı GitHub Actions Artifacts olarak yükle
      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: VaktimizPro-APK
          path: apk-output/VaktimizPro.apk
          if-no-files-found: error
          retention-days: 30
