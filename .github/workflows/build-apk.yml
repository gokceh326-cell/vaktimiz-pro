name: Vaktimiz Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e

          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/vaktimizpro/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          if [ ! -f index.html ]; then
            echo "HATA: index.html bulunamadı."
            exit 1
          fi

          cp index.html app/src/main/assets/index.html

          for item in css js assets images img fonts videos audio; do
            if [ -e "$item" ]; then
              cp -R "$item" app/src/main/assets/
            fi
          done

          cat > settings.gradle <<'GRADLE'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "VaktimizPro"

include ":app"
GRADLE

          cat > build.gradle <<'GRADLE'
plugins {
    id "com.android.application" version "8.7.3" apply false
}
GRADLE

          cat > gradle.properties <<'PROPS'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
PROPS

          cat > app/build.gradle <<'GRADLE'
plugins {
    id "com.android.application"
}

android {
    namespace "com.vaktimizpro.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.vaktimizpro.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
GRADLE

          cat > app/src/main/res/values/styles.xml <<'XML'
<?xml version="1.0" encoding="utf-8"?>
<resources>

    <style
        name="AppTheme"
        parent="android:style/Theme.Material.Light.NoActionBar">

        <item name="android:fontFamily">sans</item>
        <item name="android:statusBarColor">#000000</item>
        <item name="android:navigationBarColor">#000000</item>
        <item name="android:windowLightStatusBar">false</item>

    </style>

</resources>
XML

          cat > app/src/main/AndroidManifest.xml <<'XML'
<?xml version="1.0" encoding="utf-8"?>

<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

    <application
        android:allowBackup="true"
        android:label="Vaktimiz Pro"
        android:theme="@style/AppTheme"
        android:usesCleartextTraffic="true">

        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:screenOrientation="portrait">

            <intent-filter>

                <action android:name="android.intent.action.MAIN" />

                <category
                    android:name="android.intent.category.LAUNCHER" />

            </intent-filter>

        </activity>

    </application>

</manifest>
XML

          cat > app/src/main/java/com/vaktimizpro/app/MainActivity.java <<'JAVA'
package com.vaktimizpro.app;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;

public class MainActivity extends Activity {

    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        webView = new WebView(this);

        setContentView(webView);

        WebSettings settings = webView.getSettings();

        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setDatabaseEnabled(true);

        settings.setAllowFileAccess(true);
        settings.setAllowContentAccess(true);

        settings.setJavaScriptCanOpenWindowsAutomatically(true);

        settings.setMediaPlaybackRequiresUserGesture(false);

        settings.setBuiltInZoomControls(false);
        settings.setDisplayZoomControls(false);

        webView.setWebViewClient(new WebViewClient());
        webView.setWebChromeClient(new WebChromeClient());

        webView.loadUrl(
            "file:///android_asset/index.html"
        );
    }

    @Override
    public void onBackPressed() {

        if (webView != null && webView.canGoBack()) {

            webView.goBack();

        } else {

            super.onBackPressed();

        }
    }
}
JAVA

      - name: Gradle 8.9 indir
        shell: bash
        run: |
          set -e

          curl -fsSL \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q /tmp/gradle.zip -d /tmp

          /tmp/gradle-8.9/bin/gradle --version

      - name: APK oluştur
        shell: bash
        run: |
          set -e

          /tmp/gradle-8.9/bin/gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: APK kontrol et
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "HATA: APK oluşturulamadı."
            exit 1
          fi

          mkdir -p release

          cp "$APK" "release/Vaktimiz-Pro.apk"

          echo "APK başarıyla bulundu:"
          ls -lh "release/Vaktimiz-Pro.apk"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Vaktimiz-Pro-APK
          path: release/Vaktimiz-Pro.apk
          if-no-files-found: error
