name: Vaktimiz Pro APK Oluştur

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Android APK Derle
    runs-on: ubuntu-latest

    steps:

      # 1 - Kaynak kodu al
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      # 2 - Java 17
      - name: Java 17 kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3 - Android SDK
      - name: Android SDK kurulumu
        uses: android-actions/setup-android@v3

      # 4 - Android SDK paketleri
      - name: Android SDK paketlerini kur
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # 5 - Gradle wrapper kontrolü
      - name: Gradle wrapper kontrolü
        shell: bash
        run: |
          set -e

          if [ ! -f "gradlew" ]; then
            echo "HATA: gradlew dosyası bulunamadı."
            echo "Android projesinin kök dizininde gradlew bulunmalıdır."
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle wrapper bulundu:"
          ls -l gradlew

      # 6 - Gradle projesini kontrol et
      - name: Gradle projesini kontrol et
        shell: bash
        run: |
          set -e

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "HATA: settings.gradle veya settings.gradle.kts bulunamadı."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "HATA: app klasörü bulunamadı."
            exit 1
          fi

          echo "Android projesi bulundu."

      # 7 - Temizle
      - name: Gradle temizleme
        run: |
          ./gradlew clean

      # 8 - DEBUG APK oluştur
      # Özel keystore kullanılmıyor.
      # Android debug imzasını otomatik kullanır.
      - name: Debug APK oluştur
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      # 9 - APK'yı bul
      - name: APK dosyasını bul
        shell: bash
        run: |
          set -e

          echo "APK dosyaları aranıyor..."

          find . -type f -name "*.apk" -print

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "HATA: APK oluşturulamadı."
            exit 1
          fi

          echo "Bulunan APK:"
          echo "$APK"

          mkdir -p release

          cp "$APK" "release/Vaktimiz-Pro.apk"

          echo "Hazır APK:"
          ls -lh release/Vaktimiz-Pro.apk

      # 10 - APK'yı GitHub'a yükle
      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Vaktimiz-Pro-APK
          path: release/Vaktimiz-Pro.apk
          if-no-files-found: error
          retention-days: 30

      # 11 - Son kontrol
      - name: APK kontrolü
        shell: bash
        run: |
          set -e

          test -f release/Vaktimiz-Pro.apk

          SIZE=$(stat -c%s release/Vaktimiz-Pro.apk)

          if [ "$SIZE" -le 10000 ]; then
            echo "HATA: APK dosyası şüpheli derecede küçük."
            exit 1
          fi

          echo "================================"
          echo "APK BAŞARIYLA OLUŞTURULDU"
          echo "================================"
          echo "Dosya: release/Vaktimiz-Pro.apk"
          echo "Boyut: $SIZE byte"
