name: Vaktimiz Pro APK Oluştur

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Android APK Derle
    runs-on: ubuntu-latest

    steps:

      # 1. Kodu al
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      # 2. Java 21
      - name: Java 21 kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 3. Android SDK
      - name: Android SDK kurulumu
        uses: android-actions/setup-android@v3

      # 4. Android SDK paketlerini kur
      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # 5. Android projesini oluştur
      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/vaktimiz/pro
          mkdir -p app/src/main/assets

      # 6. settings.gradle oluştur
      - name: settings.gradle oluştur
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VaktimizPro"
          include(":app")
          EOF

      # 7. Ana Gradle dosyası
      - name: Ana Gradle dosyasını oluştur
        shell: bash
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      # 8. Gradle özellikleri
      - name: Gradle özelliklerini oluştur
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      # 9. App Gradle dosyası
      - name: App Gradle dosyasını oluştur
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vaktimiz.pro'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.vaktimiz.pro'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

      # 10. Manifest
      - name: AndroidManifest oluştur
        shell: bash
        run: |
          mkdir -p app/src/main

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Vaktimiz Pro"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # 11. Tema
      - name: Android teması oluştur
        shell: bash
        run: |
          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#6750A4</item>
                  <item name="android
