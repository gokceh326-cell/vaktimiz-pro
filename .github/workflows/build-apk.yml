name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova App & Inject Web Files
        run: |
          cordova create cordova_app com.example.myapp MyApp
          mkdir -p cordova_app/www
          rsync -av --exclude='cordova_app' --exclude='.git' --exclude='.github' ./ cordova_app/www/
          cd cordova_app
          cordova platform add android

      - name: Build APK
        run: |
          cd cordova_app
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: cordova_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
