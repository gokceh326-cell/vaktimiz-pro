name: Vaktimiz Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: APK oluştur
    runs-on: ubuntu-22.04

    steps:

      - name: Kaynak kodu al
        uses: actions/checkout@v4


      - name: Java 17 kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Android SDK kurulumu
        uses: android-actions/setup-android@v3


      - name: Android SDK hazırla
        shell: bash
        run: |
          set -e

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager bulunamadı."
            find "$ANDROID_SDK_ROOT" -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK hazır."


      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/vaktimizpro/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

          if [ ! -f index.html ]; then
            echo "HATA: index.html bulunamadı."
            exit 1
          fi

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VaktimizPro"
          include(":app")
          EOF


          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.8.2' apply false
          }
          EOF


          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vaktimizpro.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.vaktimizpro.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity:1.10.1'
          }
          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:label="Vaktimiz Pro"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#4CAF50</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF


          cat > app/src/main/java/com/vaktimizpro/app/MainActivity.java <<'EOF'
          package com.vaktimizpro.app;

          import android.Manifest;
          import android.os.Build;
          import android.os.Bundle;
          import android.content.pm.PackageManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.activity.OnBackPressedCallback;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      settings.setMixedContentMode(
                          WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                      );
                  }

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                              String origin,
                              GeolocationPermissions.Callback callback) {

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                              checkSelfPermission(
                                  Manifest.permission.ACCESS_FINE_LOCATION
                              ) != PackageManager.PERMISSION_GRANTED) {

                              requestPermissions(
                                  new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION
                                  },
                                  100
                              );
                          }

                          callback.invoke(origin, true, false);
                      }

                      @Override
                      public void onPermissionRequest(
                              PermissionRequest request) {

                          runOnUiThread(() ->
                              request.grant(request.getResources())
                          );
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");

                  getOnBackPressedDispatcher().addCallback(
                      this,
                      new OnBackPressedCallback(true) {

                          @Override
                          public void handleOnBackPressed() {

                              if (webView.canGoBack()) {
                                  webView.goBack();
                              } else {
                                  finish();
                              }
                          }
                      }
                  );
              }

              @Override
              protected void onDestroy() {

                  if (webView != null) {
                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF


      - name: Gradle kurulumu
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.10.2"

          curl -L \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip

          mkdir -p /opt/gradle

          unzip -q /tmp/gradle.zip -d /opt/gradle

          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"


      - name: Gradle kontrolü
        shell: bash
        run: |
          set -e
          java -version
          gradle --version


      - name: APK oluştur
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace :app:assembleRelease


      - name: APK dosyasını kontrol et
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK bulunamadı."
            find app -type f -name "*.apk" -print
            exit 1
          fi

          ls -lh "$APK"


      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Vaktimiz-Pro-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
