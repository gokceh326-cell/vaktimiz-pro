name: Vaktimiz Pro APK Oluştur

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Android APK Derle
    runs-on: ubuntu-latest

    steps:

      # 1. KAYNAK KODU AL
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      # 2. JAVA 21
      - name: Java 21 kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 3. ANDROID SDK
      - name: Android SDK kurulumu
        uses: android-actions/setup-android@v3

      # 4. GEREKLİ SDK PAKETLERİ
      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. ANDROID PROJESİ OLUŞTUR
      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e

          rm -rf android-app

          mkdir -p android-app/app/src/main/java/com/vaktimiz/pro
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi

      # 6. SETTINGS.GRADLE
      - name: settings.gradle oluştur
        shell: bash
        run: |
          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VaktimizPro"
          include(":app")
          EOF

      # 7. ANA GRADLE
      - name: Ana Gradle dosyasını oluştur
        shell: bash
        run: |
          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      # 8. GRADLE PROPERTIES
      - name: Gradle özelliklerini oluştur
        shell: bash
        run: |
          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      # 9. APP GRADLE
      - name: App Gradle dosyasını oluştur
        shell: bash
        run: |
          cat > android-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vaktimiz.pro'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.vaktimiz.pro'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }

                  debug {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

      # 10. MANIFEST
      - name: AndroidManifest oluştur
        shell: bash
        run: |
          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="Vaktimiz Pro"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # 11. TEMA
      - name: Android temasını oluştur
        shell: bash
        run: |
          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style name="AppTheme"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionMode
