name: Vaktimiz Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: APK Oluştur
    runs-on: ubuntu-latest

    steps:
      # 1. Kaynak kodunu al
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Java 17 kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Android SDK kurulumu
        uses: android-actions/setup-android@v3

      # 4. Gerekli Android SDK paketlerini kur
      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Android projesini oluştur
      - name: Android projesini oluştur
        shell: bash
        run: |
          set -e

          mkdir -p android-app
          mkdir -p android-app/app/src/main/java/com/vaktimizpro/app
          mkdir -p android-app/app/src/main/assets

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VaktimizPro"
          include(":app")
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          mkdir -p android-app/app

          cat > android-app/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.vaktimizpro.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.vaktimizpro.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.15.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

      # 6. Manifest
      - name: AndroidManifest oluştur
        shell: bash
        run: |
          set -e

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Vaktimiz Pro"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

      # 7. Tema
      - name: Android temasını oluştur
        shell: bash
        run: |
          set -e

          mkdir -p android-app/app/src/main/res/values

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="Theme.AppCompat.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:colorAccent">#4CAF50</item>
                  <item name="android:navigationBarColor">#101114</item>
                  <item name="android:statusBarColor">#101114</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

      # 8. Ana Android ekranı
      - name: MainActivity oluştur
        shell: bash
        run: |
          set -e

          cat > android-app/app/src/main/java/com/vaktimizpro/app/MainActivity.kt <<'EOF'
          package com.vaktimizpro.app

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.os.Bundle
          import android.view.View
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebResourceError
          import android.graphics.Color
          import android.net.Uri
          import android.content.Intent
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.webkit.WebViewAssetLoader

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  webView = WebView(this)

                  webView.setBackgroundColor(Color.BLACK)

                  val assetLoader = WebViewAssetLoader.Builder()
                      .addPathHandler(
                          "/assets/",
                          WebViewAssetLoader.AssetsPathHandler(this)
                      )
                      .build()

                  webView.webViewClient = object : WebViewClient() {

                      override fun shouldInterceptRequest(
                          view: WebView,
                          request: WebResourceRequest
                      ) = assetLoader.shouldInterceptRequest(request.url)

                      override fun shouldOverrideUrlLoading(
                          view: WebView,
                          request: WebResourceRequest
                      ): Boolean {

                          val url = request.url.toString()

                          if (
                              url.startsWith("http://") ||
                              url.startsWith("https://")
                          ) {
                              return false
                          }

                          return try {
                              startActivity(
                                  Intent(
                                      Intent.ACTION_VIEW,
                                      Uri.parse(url)
                                  )
                              )
                              true
                          } catch (_: Exception) {
                              false
                          }
                      }

                      @Deprecated("Deprecated in Java")
                      override fun shouldOverrideUrlLoading(
                          view: WebView,
                          url: String
                      ): Boolean {
                          return false
                      }

                      override fun onReceivedError(
                          view: WebView,
                          request: WebResourceRequest,
                          error: WebResourceError
                      ) {
                          super.onReceivedError(view, request, error)
                      }
                  }

                  webView.webChromeClient = WebChromeClient()

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      allowContentAccess = true
                      mediaPlaybackRequiresUserGesture = false
                      javaScriptCanOpenWindowsAutomatically = true
                      setSupportMultipleWindows(true)
                      loadsImagesAutomatically = true
                      mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                      cacheMode = WebSettings.LOAD_DEFAULT
                  }

                  webView.overScrollMode = View.OVER_SCROLL_NEVER

                  setContentView(webView)

                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/index.html"
                  )

                  onBackPressedDispatcher.addCallback(
                      this,
                      object : OnBackPressedCallback(true) {

                          override fun handleOnBackPressed() {

                              if (webView.canGoBack()) {
                                  webView.goBack()
                              } else {
                                  finish()
                              }
                          }
                      }
                  )
              }

              override fun onDestroy() {
                  webView.stopLoading()
                  webView.destroy()
                  super.onDestroy()
              }
          }
          EOF

      # 9. Mevcut büyük index.html dosyasını APK içine koy
      - name: index.html dosyasını Android'e kopyala
        shell: bash
        run: |
          set -e

          if [ ! -f "index.html" ]; then
            echo "HATA: Ana dizinde index.html bulunamadı."
            exit 1
          fi

          cp index.html android-app/app/src/main/assets/index.html

          echo "index.html APK içine kopyalandı."
          wc -l android-app/app/src/main/assets/index.html

      # 10. Gradle kurulumu
      - name: Gradle kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 11. Gradle projesini kontrol et
      - name: Gradle projesini kontrol et
        working-directory: android-app
        shell: bash
        run: |
          set -e

          gradle --version
          gradle tasks --all

      # 12. APK oluştur
      - name: APK oluştur
        working-directory: android-app
        shell: bash
        run: |
          set -e

          gradle clean assembleRelease --no-daemon --stacktrace

      # 13. APK'nın gerçek çıktısını bul
      - name: APK dosyasını bul
        id: find_apk
        shell: bash
        run: |
          set -e

          echo "APK dosyaları aranıyor..."

          find android-app -type f -name "*.apk" -print

          APK_PATH="$(find android-app/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "HATA: APK oluşturulduktan sonra APK dosyası bulunamadı."
            echo "Build klasörü:"
            find android-app/app/build -maxdepth 8 -type f -print || true
            exit 1
          fi

          echo "Bulunan APK: $APK_PATH"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      # 14. APK'yı sabit isimle hazırla
      - name: APK'yı paketle
        shell: bash
        run: |
          set -e

          mkdir -p apk-output

          cp "${{ steps.find_apk.outputs.apk_path }}" \
             "apk-output/Vaktimiz-Pro.apk"

          ls -lh apk-output/Vaktimiz-Pro.apk

      # 15. APK'yı GitHub Actions'tan indirilebilir hale getir
      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Vaktimiz-Pro-APK
          path: apk-output/Vaktimiz-Pro.apk
          if-no-files-found: error
          retention-days: 30
